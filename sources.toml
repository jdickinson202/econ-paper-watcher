series = "Economics Discussion Papers"
url = "https://www.sciencespo.fr/department-economics/research/publications-and-working-papers/sciences-po-economics-discussion-papers/"
links = '(sciencespo\.hal\.science|hal-sciencespo\.archives-ouvertes\.fr)/hal-\d+'
note = "The page lists the papers by year and links to their HAL records, which the watcher never opens. A few old papers link to PDFs instead and are left out. robots.txt asks for ten seconds between requests; the watcher makes one a day."

[[source]]
name = "Tinbergen Institute"
series = "TI Discussion Papers"
url = "https://tinbergen.nl/discussion-papers"
item = "article._publication-article"
links = '/discussion-paper/\d+/[^/?#]+$'
title_match = '^(?:\S+ - )?(.+?)\s+Authors?\s*:'
note = "Newest first. The link text gives the number, the title and then the authors; title_match stops at the authors."

[[source]]
name = "CentER (Tilburg)"
series = "CentER Discussion Papers"
enabled = false
reason = "Each link runs the year, number, authors and title together, so the title can't be told apart."
url = "https://www.tilburguniversity.edu/research/economics-and-management/publications/discussion-paper"
links = 'research\.tilburguniversity\.edu/en/publications/[0-9a-f-]+$'
note = "Newest first. Each paper links to its record on the university's research portal. The text has no separate title element, so an entry reads '2026 nr.020 Authors Title'. The portal's own RSS is disallowed by its robots.txt."

[[source]]
name = "UNU-MERIT (Maastricht)"
series = "UNU-MERIT Working Papers"
url = "https://unu-merit.nl/publications/wp.php"
item = ".pub-entry"
title = "strong"
links = '/publications/abstract\.php\?id=\d+$'
note = "The page opens on the current year's papers, newest first, so it may be short or empty early in a year. The query string is the paper's identity, so strip_query must stay off."
alert = "https://unu-merit.nl/signup/wp.html"
allow_empty = true

[[source]]
name = "CORE / LIDAM (UCLouvain)"
series = "LIDAM Discussion Papers (CORE)"
enabled = false
reason = "A year's papers sit in one paragraph and each link says only '2026 / 22', so there is no title to take."
url = "https://uclouvain.be/en/research-institutes/lidam/core/core-dp-since1992"
links = 'hdl\.handle\.net/2078(\.\d+)?/\d+$'
min_title = 8
note = "All papers since 1992 on one page, newest first. A whole year's papers sit in one paragraph, so a title can't be told apart for each link, and min_title keeps the link text, such as '2026 / 22', as the title. A paper listed before its record exists has an empty link and appears once it gets one. A few old papers link to dial.uclouvain.be instead and are left out."

[[source]]
name = "CEMFI (Madrid)"
series = "CEMFI Working Papers"
url = "https://www.cemfi.es/research/publications/index.asp"
links = '/ftp/wp/\d+\.pdf$'
allow_empty = true
note = "The page opens on the current year's papers, oldest first, so new papers appear at the end and the list may be short or empty early in a year. Each paper links straight to its PDF."

[[source]]
name = "CER-ETH (ETH Zurich)"
series = "CER-ETH Working Papers"
url = "https://cer.ethz.ch/research/working-papers.html"
links = '/cer-eth/.*/working-papers/wp-\d+-\d+\.pdf$'
title_match = '^Download\s+(.+?)\s*\(PDF'
note = "Nearly the whole series is on one page, newest first, so the first check records about 300 papers. Each paper links straight to its PDF."

# ---- Conferences -----------------------------------------------------------------------------------------

[[source]]
name = "AEA / ASSA Annual Meeting"
series = "Session papers (January)"
# The program (sessions, and papers inside each session) goes up once a year, in the autumn, on a new address
# (/conference/2027/preliminary, later /conference/2027/program). The landing page always links to the current one, so a
# new link here means the next meeting's program is out. Individual papers are not watched: a program has hundreds of
# sessions behind separate pages.
url = "https://www.aeaweb.org/conference/"
links = '/conference/\d{4}/(preliminary|program)/?$'
min_title = 12
note = "Yearly signal only: one new entry when the next ASSA program is posted."

[[source]]
name = "Jackson Hole Economic Policy Symposium"
series = "Symposium papers (August)"
url = "https://www.kansascityfed.org/research/jackson-hole-economic-symposium/"
links = '^https://www\.kansascityfed\.org/research/jackson-hole-economic-symposium/\d{4}/?$'

[[source]]
name = "NBER Summer Institute"
series = "Workshop papers (July)"
url = "https://www.nber.org/conferences/summer-institute"
links = '^https://www\.nber\.org/conferences/summer-institute-\d{4}'

[[source]]
name = "Society for Economic Dynamics"
series = "SED Meeting Papers"
url = "https://www.economicdynamics.org/"
enabled = false
reason = "SED's own site lists no meeting papers or program (each meeting page is a short notice with no links to papers), and the RePEc list stopped in 2024"
note = "The 2027 meeting (Lisbon, July 1-3) is announced on the home page with the call for papers still to come. If SED starts posting a program or paper list, point this recipe at it."
