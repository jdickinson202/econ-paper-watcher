# ---- Universities & research centers ---------------------------------------------------------------------

[[source]]
name = "CEGA (Berkeley)"
series = "CEGA Working Papers"
# escholarship.org itself is now behind a bot check (its rss feed answers with a "verifying your web request" page), so
# this reads CEGA's own Reports & Publications list instead. The list mixes working papers (which link to
# escholarship.org/uc/item/...) with briefs and reports; the links filter keeps the working papers. Newest first, 50 per page.
url = "https://cega.berkeley.edu/our-resources/documents/"
item = "article.c-list-item"
title = ".c-list-item__title a"
links = 'escholarship\.org/uc/item/'
min_title = 8

[[source]]
name = "CReAM (UCL)"
series = "CReAM Discussion Papers"
url = "https://www.rfberlin.com/feed/?post_type=network-paper"
kind = "feed"
min_title = 6
note = "The series is now published jointly with the Rockwool Foundation Berlin (RFBerlin), and this is the WordPress feed behind rfberlin.com/discussion-papers/ (RFBerlin and CReAM papers plus Handbook of Labor Economics chapters; the HTML list shows only 6 per page, the feed 10). CReAM's own list (cream-migration.org/discussion-papers.htm) cannot be used: every Download link points at the same folder (the PDF name sits in a data-location attribute) and its newest paper is from July 2025."

[[source]]
name = "Energy Institute at Haas (Berkeley)"
series = "Energy Institute Working Papers"
# One paragraph per paper: authors in bold, then the title as a link to the PDF (or to eScholarship), then an "Abstract"
# link. Most PDFs sit under /wp-content/uploads/archive/ but the newest do not, and the newest papers link to eScholarship,
# so the title links look likely to change as papers age. Each paper is therefore identified by its abstract page (a
# steadier address), and the title is the first link in the paragraph.
url = "https://haas.berkeley.edu/energy-institute/research/working-papers/"
item = "article.page-content p"
title = "a"
links = '/energy-institute/research/abstracts/'
min_title = 10

[[source]]
name = "EPIC (Chicago)"
series = "EPIC Working Papers"
url = "https://epic.uchicago.edu/working-papers/feed/"
kind = "feed"
min_title = 6
note = "EPIC's Working Paper Feed. The archive page epic.uchicago.edu/working-papers/ has no list in its HTML, and epic.uchicago.edu/publications/ shows the same ten items as HTML. The feed also carries papers EPIC files as journal articles."

[[source]]
name = "International Inequalities Institute (LSE)"
series = "III Working Papers"
url = "https://www.lse.ac.uk/International-Inequalities/Publications/Working-Papers"
item = ".accordion-item"
links = '(researchonline|eprints)\.lse\.ac\.uk/(id/eprint/)?\d+/?$'
min_title = 8
note = "One accordion block per paper. The link is the paper's LSE Research Online record (newer papers on researchonline.lse.ac.uk, older ones on eprints.lse.ac.uk); the Download paper PDFs are skipped because the record page is the one link every paper has."

[[source]]
name = "Joint Center for Housing Studies (Harvard)"
series = "JCHS Working Papers"
url = "https://www.jchs.harvard.edu/research"
enabled = false
reason = "there is no single list of working papers; each research-area page lists only its own"
note = "The old list (research-areas/working-papers) is gone. Working papers still live at /research-areas/working-papers/<name>, and each of the ten research-area pages can be filtered to them, for example /research-areas/housing-markets?publication_type%5B53%5D=53. Those pages overlap very little, so one page would catch only a small share of new papers. The JCHS mailing list (signup form at the foot of jchs.harvard.edu) covers news, blog and events, not working papers as such."

[[source]]
name = "OPHI (Oxford)"
series = "OPHI Working Papers"
url = "https://ophi.org.uk/ophi-publications"
links = '^https://ophi\.org\.uk/publications/'
