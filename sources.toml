[[source]]
name = "Federal Trade Commission"
series = "Bureau of Economics Working Papers"
url = "https://www.ftc.gov/policy/reports/policy-reports/economics-research/working-papers"
links = '^https://www\.ftc\.gov/reports/'

[[source]]
name = "HUD (PD&R)"
series = "HUD User research and Cityscape"
url = "https://www.huduser.gov/portal/whatsnew/whatsnew.html"
# What's New mixes research reports with housing market reports, data and announcements; the Research & Reports rows
# are td.RR. Keep the research reports (/portal/publications/) and Cityscape issues, not PD&R Edge or case studies.
