title = 'h3'

[[source]]
name = "Centre for Health Economics (York)"
series = "CHE Research Papers"
url = "https://www.york.ac.uk/che/outputs/research-papers/"
scope = "main"
item = "li"
links = '/media/che/.*\.pdf$'
skip = '(?i)(lay[ %20_-]*summary|appendix|corrigendum|supplement|exec[a-z_ %20-]*summary|spreadsheet)'
note = "One list item per research paper, linking to its PDF. The title and authors are loose text after the link, so the title is cut from the item text. Lay summaries, appendices and corrigenda are skipped."
item_text = true
title_match = '\(PDF[^)]*\)\W*(.+?)(?:\s+(?:Online Appendix|Citation formats|Lay summary)\b.*)?$'

[[source]]
name = "CERGE-EI (Prague)"
