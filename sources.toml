[[source]]
name = "Securities and Exchange Commission"
series = "DERA Working Papers"
url = "https://www.sec.gov/about/divisions-offices/division-economic-risk-analysis/working-papers"
scope = "table.views-table"
links = '/division-economic-risk-analysis/staff-papers-analyses/'
alert = "https://www.sec.gov/about/divisions-offices/division-economic-risk-analysis/working-papers"
note = "Newest first, 20 per page. sec.gov asks automated tools to declare contact details in their user agent; this page answered the watcher normally when tested, but if it starts failing with HTTP 403, set enabled = false and keep the alert link (the listing page carries an email-updates signup box)."

[[source]]
name = "Social Security Administration"
series = "ORES Working Papers"
# The human page (https://www.ssa.gov/policy/research.html?type=ORES%20Working%20Paper) fills its list with JavaScript from
# this JSON file, which holds every SSA research publication; the links filter keeps the working papers.
kind = "json"
url = "https://www.ssa.gov/policy/json/research.json"
json_title = "Title"
json_link = "https://www.ssa.gov/policy/{Url}"
links = '/policy/docs/workingpapers/wp\d+\.(html|pdf)$'

[[source]]
name = "U.S. Treasury"
series = "Office of Tax Analysis Working Papers"
url = "https://home.treasury.gov/policy-issues/tax-policy/office-of-tax-analysis"
links = '^https://home\.treasury\.gov/system/files/131/'

[[source]]
name = "Bureau of Economic Analysis"
series = "BEA Working Papers"
url = "https://www.bea.gov/research/papers"
links = '^https://www\.bea\.gov/research/papers/\d{4}/'

[[source]]
name = "Bureau of Labor Statistics"
series = "BLS Working Papers"
# BLS's working papers are its "Economic Working Paper" series (WP-nnn, files ecYYnnnn); the page also lists statistical
# survey papers and NLS discussion papers, which the links filter leaves out.
url = "https://www.bls.gov/osmr/research-papers/"
item = "table.sortable_datatable tbody tr"
title = "td:nth-child(2)"
links = '/osmr/research-papers/\d{4}/ec\d+\.htm$'
note = "The whole archive is one table (about 600 papers, in file order; the page's script re-sorts it newest first), so the first check records them all. bls.gov sometimes refuses scripts; if it starts failing with HTTP 403, turn the source off."

[[source]]
name = "Statistics Canada"
series = "Analytical Studies Branch Research Paper Series"
url = "https://www150.statcan.gc.ca/n1/en/catalogue/11F0019M"
links = '^https://www150\.statcan\.gc\.ca/n1/pub/11f0019m/'

