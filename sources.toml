enabled = false
reason = "the list is on an embedded page (rug.nl/ggdc/html_publications/memorandum.htm) that answers the watcher with HTTP 406"
note = "The Research Memoranda page only holds an iframe. Its list page answers HTTP 406, and the university research portal that also lists the memoranda (research.rug.nl) shows a Cloudflare check, so neither is used. The PDFs themselves are at rug.nl/ggdc/html_publications/memorandum/gdNNN.pdf. RePEc stops at GD-176."

