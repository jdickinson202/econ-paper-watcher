# Recipes for econ-paper-watcher: one [[source]] table per listing page. README.md explains the fields.
# Regular expressions are TOML literal strings ('...'), so backslashes need no escaping.

# ---- Research networks -----------------------------------------------------------------------------------

[[source]]
name = "BREAD"
series = "BREAD Working Papers"
url = "https://www.ibread.org/working-papers"
links = 'drive\.google\.com/open\?id=|github\.com/GunnRobert/BREAD-Working-Papers/'

[[source]]
name = "ECGI"
series = "ECGI Working Papers (Finance; Law)"
url = "https://www.ecgi.global/publications/working-papers"
links = '^https://www\.ecgi\.global/publications/working-papers/'
scope = 'article.card--working-paper'

[[source]]
name = "International Growth Centre"
series = "IGC Working Papers"
url = "https://www.theigc.org/publications"
links = '^https://www\.theigc\.org/publications/'
item = 'div.c-listing__items div.views-row'
title = '.c-list-item__title'

[[source]]
name = "AEHN"
series = "African Economic History Working Papers"
url = "https://www.aehnetwork.org/working-papers/"
links = '^https://aehnetwork\.org/working-papers/[^/?#]+'

[[source]]
name = "AERC"
series = "AERC Research Papers"
# AERC's own repository (DSpace) lists papers in its "Working Papers" community. The old "Research Papers" community
# has had nothing new since early 2025, so this watches the live one. The repository's syndication feed (OpenSearch,
# Atom) comes newest first and is plain XML, unlike the repository's JavaScript pages.
url = "https://publication.aercafricalibrary.org/server/opensearch/search?format=atom&scope=c0479ea9-a4d0-489a-99b5-46b596e68515&query=*&rpp=40"
kind = "feed"
links = '/handle/123456789/\d+$'
note = "Repository community 3 (Working Papers), c0479ea9-a4d0-489a-99b5-46b596e68515; the page people see is https://publication.aercafricalibrary.org/communities/c0479ea9-a4d0-489a-99b5-46b596e68515. The Research Papers community (f8205081-589d-4954-bfe2-7f824f424541) has had nothing new since 2025. The feed also carries policy notes that AERC files in this community."

[[source]]
name = "LACEA"
series = "LACEA Working Paper Series"
url = "https://lacea.org/"
enabled = false
reason = "LACEA's website no longer has a working paper list: the old series pages are gone and the member site is built by JavaScript."
note = "Checked: lacea.org has no working-paper page in its sitemaps; vox.lacea.org (old home of the PDFs) is an empty server; lacer.lacea.org does not answer; app.lacea.org is a JavaScript app. RePEc (col:000518) stopped at 2022."

[[source]]
name = "IZA"
series = "IZA Discussion Papers"
# Plain HTML, newest number first. limit=50 is one of the page's own sizes (20, 50, 100); the default 20 could let a large
# batch push papers off the page between two checks, and max_new keeps a batch as separate entries.
url = "https://www.iza.org/publications/dp?limit=50&page=1"
links = '/publications/dp/\d+/[^/?#]+$'
max_new = 60
min_title = 5
note = "The page a person sees is https://www.iza.org/publications/dp. Each paper's page shows its JEL codes. min_title is low because real titles can be short (DP 19033 is 'Meetings')."

# ---- International organizations -------------------------------------------------------------------------

[[source]]
name = "AMRO"
series = "AMRO Working Papers"
# The Working Papers page (/?s=&_categories=working-papers) is filled in by JavaScript (FacetWP), so the HTML has no
# list. WordPress's own JSON API lists the same posts, newest first: category 1529 = Working Papers.
url = "https://www.amro-asia.org/wp-json/wp/v2/posts?categories=1529&per_page=20&_fields=link,title"
kind = "json"
json_title = "title.rendered"
json_link = "link"
note = "The page people see is https://www.amro-asia.org/?s=&_categories=working-papers, which FacetWP fills in with JavaScript; WordPress JSON API category 1529 is Working Papers."

[[source]]
name = "UN DESA"
series = "DESA Working Papers"
url = "https://desapublications.un.org/working-papers"
enabled = false
reason = "The site refuses automated requests (HTTP 403)."
alert = "https://desapublications.un.org/un-desa-voice"

[[source]]
name = "ADB Institute"
series = "ADBI Working Papers"
url = "https://www.adb.org/adbi/publications/working-papers"
enabled = false
reason = "adb.org answers scripts with HTTP 403 (Cloudflare), so the watcher cannot read ADBI's own working paper list."
alert = "https://www.adb.org/adbi/newsletter"
note = "ADBI's list is on adb.org (also /publications/series/adbi-working-papers); every adb.org page, including robots.txt, gave 403. The RePEc listing is stale. Alert link is ADBI's news/publication email signup."

[[source]]
name = "African Development Bank"
series = "AfDB Working Paper Series"
url = "https://www.afdb.org/en/documents/publications/working-paper-series"
scope = ".view-knowledge-documents .view-content"
item = ".views-field-nothing"
title = ".relatednewstitle a"
links = '/en/documents/working-paper-\d+'
note = "18 papers per page, newest number first; the menu links on the page are outside the .view-content block."

[[source]]
name = "CAF"
series = "CAF Working Papers"
# Scioteca (CAF's repository), collection 6.1 "Documentos de trabajo en investigación socioeconómica" (the Research
# Department's working papers). The collection page lists its 20 most recent submissions, newest first.
url = "https://scioteca.caf.com/handle/123456789/34"
scope = ".recent-submission"
item = "li.ds-artifact-item"
title = ".artifact-title a"
links = '/handle/123456789/\d+$'
note = "The parent collection 06. Documentos de trabajo is handle 123456789/19 and also holds sector, digital and policy papers (6.2 to 6.7)."

[[source]]
name = "EBRD"
series = "EBRD Working Papers"
url = "https://www.ebrd.com/bin/ebrd_dxp/filterlistservlet?parentPath=/content/dam/ebrd_dxp/assets/content-fragments/working-papers&cardType=working-paper&sortBy=newest-first&currentPage=1"
note = "The page people see, https://www.ebrd.com/home/news-and-events/publications/economics/working-papers.html, loads this JSON list with JavaScript. Its links come as View|/content/ebrd_dxp/uk/en/..., which rewrite turns into the public address."
kind = "json"
json_items = "searchResult"
json_title = "title"
json_link = "projectLinks.buttonLink1"
rewrite = [['^View\|/content/ebrd_dxp/uk/en', 'https://www.ebrd.com']]

[[source]]
name = "European Commission (JRC)"
series = "JRC working paper series"
# The repository's search page is a JavaScript app, but it reads its results from a JSON service that answers a plain
# GET. This asks it for the 20 newest items whose text names one of the three JRC working paper series (Economics and
# Finance; Taxation and Structural Reforms; Territorial Modelling and Analysis), newest first.
url = "https://publications.jrc.ec.europa.eu/repository/data/search/query?q=%7B%22criteria%22%3A%7B%22RESOURCE_TYPE%22%3A%22REPORT%22%7D%2C%22page%22%3A1%2C%22pageSize%22%3A20%2C%22sort%22%3A%22date-desc%22%2C%22query%22%3A%22%5C%22JRC%20Working%20Papers%20in%20Economics%20and%20Finance%5C%22%20OR%20%5C%22JRC%20Working%20Papers%20on%20Taxation%20and%20Structural%20Reforms%5C%22%20OR%20%5C%22JRC%20Working%20Papers%20on%20Territorial%20Modelling%20and%20Analysis%5C%22%22%7D&count=false"
kind = "json"
json_items = "items"
json_title = "dc.title"
json_link = "https://publications.jrc.ec.europa.eu/repository/handle/{id}"
note = "q is JSON: {criteria:{RESOURCE_TYPE:'REPORT'}, page:1, pageSize:20, sort:'date-desc', query:'\"series name\" OR ...'}. The query is a full-text phrase search, so an occasional report that only mentions a series can slip in. Economics and Finance itself has had nothing since Dec 2023; the other two series are active in 2026."

[[source]]
name = "ILO"
series = "ILO Working Papers"
url = "https://www.ilo.org/research-and-publications/working-papers"
links = '^https://www\.ilo\.org/publications/'

[[source]]
name = "Inter-American Development Bank"
series = "IDB Working Papers"
url = "https://publications.iadb.org/en"
enabled = false
reason = "The site refuses automated requests (HTTP 403, a Cloudflare check), and its robots.txt keeps bots off the filtered lists that would pick out working papers."
note = "publications.iadb.org/en answered 403 'Just a moment'. robots.txt disallows */en?* and */publications?*, which rules out /en?docType=WORKING+PAPERS."

[[source]]
name = "IFPRI"
series = "IFPRI Discussion Papers"
# IFPRI files the series in CGSpace, the CGIAR repository (DSpace), and its own page links each paper to its record there.
# The repository's syndication feed (OpenSearch, Atom) comes newest first and is plain XML.
url = "https://cgspace.cgiar.org/server/opensearch/search?format=atom&scope=d4fab241-9ec2-44ea-9e7d-b88b7debfb1e&query=*&rpp=40"
kind = "feed"
links = 'hdl\.handle\.net/10568/\d+$'
note = "Collection d4fab241-9ec2-44ea-9e7d-b88b7debfb1e (IFPRI Discussion Papers); the page people see is https://www.ifpri.org/publications/discussion-papers/. ifpri.org answered the first requests but then showed an Imperva bot check, so it is not used."

[[source]]
name = "European Stability Mechanism"
series = "ESM Working Papers"
url = "https://www.esm.europa.eu/publications?publication_type%5B1223%5D=1223"
item = ".card-basic"
title = ".card-basic__title"
links = '/publications/[^/?#]+$'
note = "The publications page filtered to Working papers (type 1223). It shows the four newest, with a 'Show more posts' link to the next page."

# ---- Central banks ---------------------------------------------------------------------------------------

[[source]]
name = "Danmarks Nationalbank"
series = "Working Papers"
# The Working Paper page redirects to the general publications page, and the knowledge archive is built by JavaScript.
# The bank publishes an RSS feed per publication type (see https://www.nationalbanken.dk/en/rss-feeds); this is the one
# for Working Papers.
url = "https://www.nationalbanken.dk/api/rssfeed?topic=Working+Paper&lang=en"
kind = "feed"
links = '/working-paper/'
note = "RSS feed per type; the feed page is https://www.nationalbanken.dk/en/rss-feeds and the page people see is https://www.nationalbanken.dk/en/search-our-knowledge-archive?type=Working+Paper. The knowledge archive search runs on api.addsearch.com, whose robots.txt blocks bots, so it is not used."

[[source]]
name = "Reserve Bank of India"
series = "RBI Working Paper Series"
url = "https://www.rbi.org.in/Scripts/OccasionalPublications.aspx?head=Working%20Papers"
scope = "#pnlMain"
links = 'PublicationsView\.aspx\?id=\d+'
note = "The page lists only the current year's papers (one so far in 2026), newest first; other years need a form post, which the watcher cannot do, so early in a year the list may be short or empty. robots.txt on rbi.org.in answers 418 (a blocked page), which the watcher reads as 'no rules'."
allow_empty = true

[[source]]
name = "Bank of Israel"
series = "Discussion Papers"
url = "https://www.boi.org.il/en/economic-roles/research-and-publications/all-research/discussion-paper-series-research-department/"
enabled = false
reason = "boi.org.il answers scripts with a Radware browser-check page instead of the list."
note = "This is the Research Department's Discussion Paper Series list on the bank's own site (active in 2026). Every boi.org.il page except robots.txt returned the Radware 'Verifying your browser' page. The RePEc listing is stale. No email-alert signup page could be confirmed (the site footer has a 'Sign-up for updates' link)."

[[source]]
name = "Bank of Korea"
series = "BOK Working Papers"
# The list.do page fills its list in with JavaScript, from the HTML fragment listCont.do. That fragment answers a plain
# GET; depth2=600354 is the "BOK Working Paper" category (the unfiltered list also has Economic Analysis and
# In-Depth Analysis), pageUnit=20 asks for 20 per page, newest first.
url = "https://www.bok.or.kr/imerEng/singl/rsrchrDataEng/listCont.do?pageIndex=1&targetDepth=2&menuNo=600354&syncMenuChekKey=0&searchCnd=1&searchKwd=&depth2=600354&depth=600093&pageUnit=20"
links = '/view\.do\?nttId=\d+'
note = "The visible page is https://www.bok.or.kr/imerEng/singl/rsrchrDataEng/list.do?menuNo=600354. robots.txt disallows / but allows /imerEng/."

[[source]]
name = "Central Bank of Chile"
series = "Working Papers (Documentos de Trabajo)"
url = "https://www.bcentral.cl/web/banco-central/nuevo-buscador?category=35828&categorias=35741&temas=35828&type=com.liferay.journal.model.JournalArticle&sort=sortableDate_sortable-"
enabled = false
reason = "The bank's working paper list is only on its search pages, which its robots.txt tells bots not to read."
alert = "https://www.bcentral.cl/suscripcion"
note = "robots.txt on bcentral.cl disallows /*nuevo-buscador*, /*buscador* and /*search* (which also matches any /research path), and /publicaciones redirects to the search page, so no allowed list was found. Individual papers are at https://www.bcentral.cl/web/banco-central/contenido/-/detalle/publicaciones/investigacion-economica/documento-de-trabajo-<number> (No. 1098 is the latest seen), but nothing allowed lists them. The alert link is the site's own Suscripcion page."

[[source]]
name = "HKIMR (Hong Kong Monetary Authority)"
series = "HKIMR Working Papers"
url = "https://www.aof.org.hk/research/HKIMR/publications-and-research/working-papers"
enabled = false
reason = "The papers are on aof.org.hk (Hong Kong Academy of Finance), whose robots.txt tells every bot except Google's to stay out."
note = "The HKMA overview page only links to this AoF page. Its list is shown by year (2010 to 2026). Separately, Python on a Windows machine could not verify aof.org.hk's certificate (issued under the Hongkong Post root); curl with Mozilla's CA bundle could."

[[source]]
name = "Reserve Bank of New Zealand"
series = "Discussion Papers"
url = "https://www.rbnz.govt.nz/research-and-publications/research/our-research-and-analysis/discussion-papers"
enabled = false
reason = "The site refuses automated requests (HTTP 403)."
alert = "https://www.rbnz.govt.nz/email-updates"

[[source]]
name = "State Bank of Pakistan"
series = "SBP Working Papers"
url = "https://www.sbp.org.pk/our-operations/publications/working-papers/361/working-papers"
links = '^https://www\.sbp\.org\.pk/assets/document/.+\.pdf'

[[source]]
name = "Banque de France"
series = "Working Papers"
url = "https://www.banque-france.fr/en/publications-and-research/our-main-publications/working-papers"
scope = ".view-espace2-liste-des-publications-et-statistique"
item = "a.card-vertical"
title = ".card-title"
links = '/publications-and-statistics/publications/[^/?#]+$'
note = "12 per page, newest first. The site sends robots.txt with the charset 'iso-8852', which Python doesn't know, so robots_allow in watch.py falls back to UTF-8 for it."

[[source]]
name = "De Nederlandsche Bank"
series = "DNB Working Papers"
url = "https://www.dnb.nl/en/rss/16455/4614/Working%20Papers"
kind = "feed"
links = '/research-publications/working-paper-\d{4}/'
note = "One of the bank's own feeds, listed at https://www.dnb.nl/en/rss/. It carries the whole series (about 600 papers, newest first), so the first check records them all. The publications page itself is built by JavaScript."

[[source]]
name = "National Bank of Belgium"
series = "NBB Working Papers"
url = "https://www.nbb.be/en/publications-research/publications/economic-and-financial-publications/working-papers"
item = "a.node-publication-teaser"
title = ".node-publication-teaser__label"
links = '/publications-research/all-publications/[^/?#]+$'
note = "The page shows only the three newest papers. Nos. 502 to 504 went up together on 8 Oct 2026, so a batch of more than three would slip past. The full list (all-publications?type[0]=1985) is off limits because robots.txt disallows /*?, and publication_rss.xml mixes every publication type with nothing in the links to tell them apart."

[[source]]
name = "Oesterreichische Nationalbank"
series = "OeNB Working Papers"
# The Working Paper page fills its list in with JavaScript from this JSON file, which answers a plain GET. pubSeries is the
# page's own "Working Paper" filter, and each paper appears twice (web page and PDF); the links filter keeps the web page.
url = "https://www.oenb.at/en/daten-und-forschung/publikationen/publikationsreihen/working-paper/mainArea/genericList.json?currentPage=0&sortType=dateDesc&pubSeries=551641bb-ccd5-4422-8ac2-7907e85439a5"
kind = "json"
json_items = "result"
json_title = "title"
json_link = "link"
links = '/publikationsreihen/working-paper/\d{4}/working-paper-\d+\.html$'
note = "The page people see is https://www.oenb.at/en/daten-und-forschung/publikationen/publikationsreihen/working-paper.html. Ten rows a page, so about five papers. robots.txt answers 404."

[[source]]
name = "Bank of Japan"
series = "BOJ Working Paper Series"
url = "https://www.boj.or.jp/en/research/wps_rev/index.htm"
links = '/wps_rev/wps_\d{4}/wp\d+e\d+\.htm$'
note = "The page shows the three newest working papers, beside the Review and Research Laboratory series, which the links filter leaves out. Each year's full list is at /en/research/wps_rev/wps_<year>/index.htm."

[[source]]
name = "Sveriges Riksbank"
series = "Working Paper Series"
title_match = '^No\. \d+ (.+)$'
url = "https://www.riksbank.se/en-gb/press-and-published/publications/working-paper-series/"
scope = "main"
item = "li"
title = ".header--file__title"
links = '/globalassets/media/rapporter/working-papers/.+\.pdf$'
note = "Newest first, split over pages. Each paper links straight to its PDF; there is no web page per paper."

[[source]]
name = "Central Bank of Ireland"
series = "Research Technical Papers"
url = "https://www.centralbank.ie/publication/research-publications/research-technical-papers"
enabled = false
reason = "the list is built by JavaScript from data inside a script on the page, so there are no links for the watcher to read"
note = "The page carries the whole list as data in a <script> (documentName and url pairs, with PDFs under /docs/default-source/publications/research-technical-papers/). The watcher drops scripts and reads only links and feeds, so a recipe would need a code change. No feed for the series was found."

[[source]]
name = "Banco de Portugal"
series = "Working Papers"
url = "https://www.bportugal.pt/en/papers"
enabled = false
reason = "The site refuses automated requests (HTTP 403)."
note = "Both robots.txt and the list answered 403 (Cloudflare)."

[[source]]
name = "Czech National Bank"
series = "CNB Working Paper Series"
# The Working paper page fills its list in with JavaScript from the HTML fragment list-ajax.jsp, which answers a plain GET.
# contentpath picks this series' list; newest first, 20 per page.
url = "https://www.cnb.cz/system/modules/org.opencms.apollo/elements/list-ajax.jsp?contentpath=/en/economic-research/research-publications/cnb-working-paper-series/.content/lists/l_00001.xml&instanceId=li_71040de6&elementId=le_561afa7e&sitepath=/en/economic-research/research-publications/cnb-working-paper-series/&subsite=/sites/cnb/en/economic-research/research-publications/cnb-working-paper-series/&__locale=en&loc=en"
links = '/research-publications/cnb-working-paper-series/[^/?#]+/?$'
note = "The page people see is https://www.cnb.cz/en/economic-research/research-publications/cnb-working-paper-series/. The bank's RSS page has no feed for this series."

[[source]]
name = "Banco de México"
series = "Working Papers (Documentos de Investigación)"
title_match = '^\d{4}-\d{2} (.+)$'
url = "https://www.banxico.org.mx/viewers2/JSP/docsInvestigacionAnio_en.jsp?static=y"
links = '/banco-de-mexico-working-papers/.+\.pdf$'
note = "The page shows the ten newest papers. Each links straight to its PDF, whose name is an identifier, and the paper's number starts its title."

[[source]]
name = "Banco Central do Brasil"
series = "Working Paper Series (Trabalhos para Discussão)"
url = "https://www.bcb.gov.br/publicacoes/trabalhosdiscussao"
enabled = false
reason = "the list is built by JavaScript, and the bank's RSS page has no feed for this series"
alert = "https://www.bcb.gov.br/publicacoes/cadastrolista_trabalhosdiscussao"
note = "The page is an empty application shell that fills itself from the site's own service; that service was not tried. The feeds at /acessoinformacao/rss cover other publications. The alert link is the series' own mailing list signup, linked from the page's content."

[[source]]
name = "Banco de la República"
series = "Borradores de Economía"
url = "https://repositorio.banrep.gov.co/collections/423d74ab-40cc-4310-95b1-6559607ebaf2"
links = '/items/[0-9a-f-]{36}$'
note = "The bank's repository (DSpace): the collection page's Recent Submissions, 20 newest first, in plain HTML. Its Atom feed is under /server, which robots.txt disallows. www.banrep.gov.co and investiga.banrep.gov.co both answered a script with a Radware bot check, so neither is used."

[[source]]
name = "South African Reserve Bank"
series = "SARB Working Paper Series"
url = "https://www.resbank.co.za/en/home/publications/working-papers"
enabled = false
reason = "resbank.co.za closes the connection on the watcher (even for robots.txt), so the list can't be read"
note = "Two tries, minutes apart, both ended in a connection reset. That was from a Windows machine, not from GitHub's runner. The PDFs are at /content/dam/sarb/publications/working-papers/<year>/."

# ---- Government agencies ---------------------------------------------------------------------------------

[[source]]
name = "Energy Information Administration"
series = "EIA Working Papers"
url = "https://www.eia.gov/workingpapers/"
links = '^https://www\.eia\.gov/workingpapers/pdf/'

[[source]]
name = "FDIC"
series = "Center for Financial Research Working Papers"
