[[source]]
name = "Oxford Department of Economics"
series = "Economics Discussion Paper Series"
url = "https://www.economics.ox.ac.uk/research/working-papers"
enabled = false
reason = "the list is built by JavaScript"
note = "The page mounts a Symplectic widget that loads the list with a POST request to symplectic.embed.it.ox.ac.uk/api/publications (a plain GET answers 405), and the widget's 'show more' page is the same widget. RePEc (ideas.repec.org/s/oxf/wpaper.html) lists the series up to no. 1083, so it should already reach NEP."

[[source]]
name = "Oxford University Centre for Business Taxation"
series = "CBT Working Papers"
url = "https://oxfordtax.sbs.ox.ac.uk/working-papers"
links = '^https://oxfordtax\.sbs\.ox\.ac\.uk/wp\d'

[[source]]
name = "Pension Research Council (Wharton)"
series = "PRC Working Papers"
url = "https://pensionresearchcouncil.wharton.upenn.edu/papers/"
scope = "ul.bullet-list"
item = "li"
links = '(papers\.ssrn\.com/|ssrn\.com/abstract|pensionresearchcouncil\.wharton\.upenn\.edu/wp-content/uploads/\d{4}/\d{2}/[^/]+\.pdf$)'
min_title = 8
note = "The page lists papers by year, with 2026 first; inside a year the oldest paper comes first, so new papers appear at the end of the current year's list. New papers link either to SSRN or to a PDF under /wp-content/uploads/YYYY/MM/. The 356 old links to repository.upenn.edu are left out on purpose."

[[source]]
name = "PUC Chile"
series = "Documentos de Trabajo (Instituto de Economía)"
url = "https://economia.uc.cl/tipo_publicacion/documento-de-trabajo/"
item = ".uc-card"
title = "h2"
links = '/biblioteca/'
min_title = 8
note = "WordPress archive of the 'Documento de trabajo' publication type, newest first, ten per page. The /investigacion/ page builds the same list with JavaScript."

[[source]]
name = "SALDRU (University of Cape Town)"
series = "SALDRU Working Papers"
url = "https://opensaldru.uct.ac.za/handle/11090/11/browse?type=dateissued&order=DESC&rpp=40"
scope = "ul.ds-artifact-list"
links = '/handle/11090/\d+$'
min_title = 8
note = "The OpenSALDRU repository (DSpace), working papers browsed by date issued, newest first, 40 per page. Use the host without www: www.opensaldru.uct.ac.za has a certificate for a different name."

[[source]]
name = "SIEPR (Stanford)"
series = "SIEPR Working Papers"
url = "https://siepr.stanford.edu/research/publications/working-papers"
links = '^https://siepr\.stanford\.edu/publications/working-paper/.+'

[[source]]
name = "Stanford GSB"
series = "GSB Working Papers"
url = "https://www.gsb.stanford.edu/faculty-research/working-papers"
links = '^https://www\.gsb\.stanford\.edu/faculty-research/working-papers/.+'

[[source]]
name = "STICERD (LSE)"
series = "STICERD Discussion Papers"
url = "https://sticerd.lse.ac.uk/_new/publications/econometrics/"
item = "div.publications-summary"
title = "h5"
links = '/publications/abstract/\?index=\d+'
min_title = 8
note = "The Econometrics series (EM) is the only STICERD discussion paper series still publishing. The others stopped long ago: Theoretical Economics 2015 (/_new/publications/theoretical-economics/), Public Economics 2018, Economics of Industry 2020, Development 2007, Political Economy and Public Policy 2008, EEE 2021, and EOPP has no list page on the new site. The /_new/publications/ page mixes in CASE reports, journal articles and blog posts, so it is not used. The query string is the paper's identity, so strip_query must stay off."

[[source]]
name = "Universidad del Pacífico"
series = "Documentos de Discusión (CIUP)"
url = "https://ciup.up.edu.pe/publicaciones/"
enabled = false
reason = "the list is built by JavaScript, and the repository copy of the series shows a bot check"
note = "ciup.up.edu.pe/publicaciones/ shows the 20 newest items of every type, filters and pages by a POST request (a GET query string is ignored), and does not seem to list the discussion papers at all. The series is in the university repository (repositorio.up.edu.pe, handles 11354/...), which answers the watcher with an Anubis bot check, feeds included."

[[source]]
name = "Uppsala University"
series = "Department of Economics Working Papers"
url = "https://www.uu.se/en/department/economics/research"
enabled = false
reason = "the series is listed only in DiVA, which shows a bot check, and DiVA's robots.txt keeps bots off its search result pages"
note = "The department site has no working-paper list (its Scientific publications page holds peer-reviewed journal articles only). DiVA (uu.diva-portal.org) answers the watcher with an Anubis bot check, its robots.txt disallows /smash/resultList.jsf, and urn.kb.se/resolve is disallowed too. EconStor, which also holds the series, shows the same bot check. RePEc stops at 2020:6."

# ---- Conferences -----------------------------------------------------------------------------------------

[[source]]
name = "AEA / ASSA Annual Meeting"
series = "Session papers (January)"
# The program (sessions, and papers inside each session) goes up once a year, in the autumn, on a new address
# (/conference/2027/preliminary, later /conference/2027/program). The landing page always links to the current one, so a
# new link here means the next meeting's program is out. Individual papers are not watched: a program has hundreds of
# sessions behind separate pages.
url = "https://www.aeaweb.org/conference/"
links = '/conference/\d{4}/(preliminary|program)/?$'
min_title = 12
note = "Yearly signal only: one new entry when the next ASSA program is posted."

[[source]]
name = "Jackson Hole Economic Policy Symposium"
series = "Symposium papers (August)"
url = "https://www.kansascityfed.org/research/jackson-hole-economic-symposium/"
links = '^https://www\.kansascityfed\.org/research/jackson-hole-economic-symposium/\d{4}/?$'

[[source]]
name = "NBER Summer Institute"
series = "Workshop papers (July)"
url = "https://www.nber.org/conferences/summer-institute"
links = '^https://www\.nber\.org/conferences/summer-institute-\d{4}'

[[source]]
name = "Society for Economic Dynamics"
series = "SED Meeting Papers"
url = "https://www.economicdynamics.org/"
enabled = false
reason = "SED's own site lists no meeting papers or program (each meeting page is a short notice with no links to papers), and the RePEc list stopped in 2024"
note = "The 2027 meeting (Lisbon, July 1-3) is announced on the home page with the call for papers still to come. If SED starts posting a program or paper list, point this recipe at it."
