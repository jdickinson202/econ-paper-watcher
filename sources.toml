scope = ".anaquel"
item = ".libros a"
title = ".titulo"
links = 'hdl\.handle\.net/11445/\d+'
note = "The page lists 15 papers, newest first. The newest is from February 2020, so this series looks dormant. The unrelated 'latest publication' box on the page is outside .anaquel."

[[source]]
name = "Hoover Institution"
series = "Economics Working Papers"
